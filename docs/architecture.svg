<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="640" viewBox="0 0 1100 640" font-family="Arial, Helvetica, sans-serif">
  <rect width="1100" height="640" fill="#f5f2ea"/>
  <text x="48" y="54" font-size="30" fill="#171713">What enforces the payee decision?</text>
  <text x="48" y="82" font-size="15" fill="#55534b">Ledgerly on QDay Aevum — the browser proposes, the contracts decide.</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#171713"/>
    </marker>
    <marker id="arrow-copper" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#b6602a"/>
    </marker>
  </defs>

  <!-- Row 1 -->
  <rect x="48" y="120" width="250" height="132" rx="6" fill="#faf8f2" stroke="#171713" stroke-width="2"/>
  <text x="68" y="152" font-size="17" font-weight="bold" fill="#171713">Browser (Next.js)</text>
  <text x="68" y="180" font-size="13" fill="#55534b">Paste or upload invoices</text>
  <text x="68" y="202" font-size="13" fill="#55534b">Review every extracted field</text>
  <text x="68" y="224" font-size="13" fill="#55534b">One owner approval</text>
  <text x="68" y="246" font-size="13" fill="#55534b">viem / wagmi over HTTPS RPC</text>

  <rect x="410" y="120" width="270" height="132" rx="6" fill="#faf8f2" stroke="#b6602a" stroke-width="3"/>
  <text x="430" y="152" font-size="17" font-weight="bold" fill="#8a4820">Policy (funded budget)</text>
  <text x="430" y="180" font-size="13" fill="#55534b">per-payment / daily / lifetime caps</text>
  <text x="430" y="202" font-size="13" fill="#55534b">expiry · instant revoke · owner-only settle</text>
  <text x="430" y="224" font-size="13" fill="#55534b">duplicate-reference guard</text>
  <text x="430" y="246" font-size="13" fill="#55534b">spends only its own tUSD8 balance</text>

  <rect x="790" y="120" width="260" height="132" rx="6" fill="#faf8f2" stroke="#3c6b4f" stroke-width="3"/>
  <text x="810" y="152" font-size="17" font-weight="bold" fill="#3c6b4f">PayeeRegistry</text>
  <text x="810" y="180" font-size="13" fill="#55534b">one payee id → one active address</text>
  <text x="810" y="202" font-size="13" fill="#55534b">changes wait in a public window</text>
  <text x="810" y="224" font-size="13" fill="#55534b">guardian freeze beats the queue</text>
  <text x="810" y="246" font-size="13" fill="#55534b">activeAccount() at settlement time</text>

  <!-- Browser -> Policy -->
  <line x1="298" y1="186" x2="405" y2="186" stroke="#171713" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="300" y="174" font-size="12" fill="#55534b">executeBatch (owner)</text>

  <!-- Policy -> Registry -->
  <line x1="680" y1="186" x2="785" y2="186" stroke="#171713" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="680" y="174" font-size="12" fill="#55534b">activeAccount(id)</text>

  <!-- Chain box -->
  <rect x="330" y="330" width="440" height="84" rx="6" fill="#171713"/>
  <text x="352" y="362" font-size="16" font-weight="bold" fill="#f5f2ea">QDay Aevum · chain 44005</text>
  <text x="352" y="388" font-size="13" fill="#d8d2c4">tUSD8 (6 decimals) · Shanghai EVM</text>

  <!-- Policy -> chain -->
  <line x1="545" y1="252" x2="545" y2="325" stroke="#b6602a" stroke-width="2" marker-end="url(#arrow-copper)"/>
  <text x="558" y="300" font-size="12" fill="#8a4820">settles tUSD8</text>

  <!-- Registry -> chain (state) -->
  <line x1="920" y1="252" x2="920" y2="314" stroke="#3c6b4f" stroke-width="2" stroke-dasharray="4 4"/>
  <line x1="920" y1="314" x2="776" y2="372" stroke="#3c6b4f" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
  <text x="930" y="300" font-size="12" fill="#3c6b4f">state lives here</text>

  <!-- Chain -> Reconciliation -->
  <line x1="430" y1="418" x2="300" y2="486" stroke="#171713" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="300" y="452" font-size="12" fill="#55534b">PayoutSettled events</text>

  <!-- Reconciliation -->
  <rect x="48" y="490" width="480" height="104" rx="6" fill="#faf8f2" stroke="#171713" stroke-width="2"/>
  <text x="68" y="522" font-size="16" font-weight="bold" fill="#171713">Reconciliation (client-side)</text>
  <text x="68" y="550" font-size="13" fill="#55534b">Read PayoutSettled in 1,000-block chunks</text>
  <text x="68" y="572" font-size="13" fill="#55534b">Label payees, compare with your books, export CSV</text>

  <text x="48" y="620" font-size="12" fill="#8a877d">Trust boundary: no server holds keys, funds, or books. All evidence is public on Aevum.</text>
</svg>
