<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" font-family="Arial, Helvetica, sans-serif">
  <rect width="1100" height="620" fill="#f5f2ea"/>
  <text x="48" y="56" font-size="30" fill="#171713">What enforces the payee decision?</text>
  <text x="48" y="84" font-size="15" fill="#55534b">Ledgerly on QDay Aevum — the browser proposes, the contracts decide.</text>

  <!-- Browser -->
  <rect x="48" y="130" width="250" height="150" rx="6" fill="#faf8f2" stroke="#171713" stroke-width="2"/>
  <text x="68" y="162" font-size="17" font-weight="bold" fill="#171713">Browser (no backend)</text>
  <text x="68" y="192" font-size="13" fill="#55534b">Paste invoices → parse + edit</text>
  <text x="68" y="216" font-size="13" fill="#55534b">Read payee() / state()</text>
  <text x="68" y="240" font-size="13" fill="#55534b">One owner approval</text>
  <text x="68" y="264" font-size="13" fill="#55534b">viem / wagmi over HTTPS RPC</text>

  <!-- Policy -->
  <rect x="410" y="130" width="270" height="150" rx="6" fill="#faf8f2" stroke="#b6602a" stroke-width="3"/>
  <text x="430" y="162" font-size="17" font-weight="bold" fill="#8a4820">Policy (funded budget)</text>
  <text x="430" y="192" font-size="13" fill="#55534b">per-payment / daily / lifetime caps</text>
  <text x="430" y="216" font-size="13" fill="#55534b">expiry · instant revoke · replay guard</text>
  <text x="430" y="240" font-size="13" fill="#55534b">spends only its own tUSD8 balance</text>
  <text x="430" y="264" font-size="13" fill="#55534b">emits PayoutSettled(batchId, …)</text>

  <!-- Registry -->
  <rect x="770" y="130" width="280" height="150" rx="6" fill="#faf8f2" stroke="#3c6b4f" stroke-width="3"/>
  <text x="790" y="162" font-size="17" font-weight="bold" fill="#3c6b4f">PayeeRegistry</text>
  <text x="790" y="192" font-size="13" fill="#55534b">one payee id → one active address</text>
  <text x="790" y="216" font-size="13" fill="#55534b">changes wait in a public window</text>
  <text x="790" y="240" font-size="13" fill="#55534b">guardian freeze beats the queue</text>
  <text x="790" y="264" font-size="13" fill="#55534b">activeAccount() at settlement time</text>

  <!-- Arrows -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#171713"/>
    </marker>
  </defs>
  <line x1="298" y1="205" x2="405" y2="205" stroke="#171713" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="300" y="193" font-size="12" fill="#55534b">executeBatch(payouts)</text>
  <line x1="680" y1="205" x2="765" y2="205" stroke="#171713" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="680" y="193" font-size="12" fill="#55534b">activeAccount(id)</text>

  <!-- Chain -->
  <rect x="410" y="350" width="270" height="80" rx="6" fill="#171713"/>
  <text x="430" y="382" font-size="16" font-weight="bold" fill="#f5f2ea">QDay Aevum · chain 44005</text>
  <text x="430" y="408" font-size="13" fill="#d8d2c4">tUSD8 (6 decimals) · Shanghai EVM</text>

  <!-- Reconciliation -->
  <rect x="48" y="470" width="460" height="110" rx="6" fill="#faf8f2" stroke="#171713" stroke-width="2"/>
  <text x="68" y="502" font-size="16" font-weight="bold" fill="#171713">Reconciliation (client-side)</text>
  <text x="68" y="530" font-size="13" fill="#55534b">Scan PayoutSettled in 1,000-block chunks</text>
  <text x="68" y="554" font-size="13" fill="#55534b">Match staged books → flag discrepancies → CSV export</text>

  <line x1="545" y1="280" x2="545" y2="430" stroke="#171713" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="410" y1="475" x2="305" y2="475" stroke="#171713" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="330" y="462" font-size="12" fill="#55534b">events</text>

  <text x="48" y="600" font-size="12" fill="#8a877d">Trust boundary: no server holds keys, funds, or books. All evidence is public on Aevum.</text>
</svg>
